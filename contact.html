<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Muhammad Shahzad</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header>
  <div class="container header-flex">
    <h1 class="logo">Muhammad <span>Shahzad</span></h1>
    <nav id="navbar">
      <ul class="nav-links">
        <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="about.html"><i class="fas fa-user"></i> About</a></li>
        <li><a href="projects.html"><i class="fas fa-briefcase"></i> Projects</a></li>
        <li><a href="contact.html" class="active"><i class="fas fa-envelope"></i> Contact</a></li>
      </ul>
      <div class="menu-toggle" id="menu-toggle">
        <i class="fas fa-bars"></i>
      </div>
    </nav>
  </div>
</header>

<section class="contact-section">
  <div class="container">
    <h2 class="section-title">Contact Me</h2>
    <div class="contact-grid">

      <div class="contact-box">
        <i class="fas fa-phone"></i>
        <h3>Call Me</h3>
        <p><a href="tel:03131182384">0313-1182384</a></p>
      </div>

      <div class="contact-box">
        <i class="fab fa-whatsapp"></i>
        <h3>WhatsApp</h3>
        <p><a href="https://wa.me/923131182384" target="_blank">0313-1182384</a></p>
      </div>

      <div class="contact-box">
        <i class="fab fa-linkedin"></i>
        <h3>LinkedIn</h3>
        <p><a href="https://www.linkedin.com/in/muhammad-shahzad-26a8522a4/?lipi=urn%3Ali%3Apage%3Ad_flagship3_feed%3Bq9FaT%2F0mRwGpOap%2BvpoL9A%3D%3D" target="_blank">Visit Profile</a></p>
      </div>

      <div class="contact-box">
        <i class="fas fa-envelope"></i>
        <h3>Email</h3>
        <p><a href="mailto:muhamad.shahzad.1989@gmail.com">muhamad.shahzad.1989@gmail.com</a></p>
      </div>

    </div>

    <!-- ===== Contact Form (Backend Connected) ===== -->
    <form class="contact-form" id="contactForm">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Your Message" rows="4" required></textarea>
      <button type="submit">Send Message</button>
    </form>

    <p id="responseMessage" style="color: green; font-weight: bold; display:none;"></p>
  </div>
</section>

<footer>
  <p>© 2025 Muhammad Shahzad | All Rights Reserved</p>
</footer>

<script>
  const menuToggle = document.getElementById('menu-toggle');
  const navLinks = document.querySelector('.nav-links');
  menuToggle.addEventListener('click', () => {
    navLinks.classList.toggle('active');
  });
</script>

<!-- ===== Form Submit Script ===== -->
<script>
document.getElementById("contactForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const name = e.target.name.value;
  const email = e.target.email.value;
  const message = e.target.message.value;

  const response = await fetch("http://localhost:5000/contact", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email, message })
  });

  const result = await response.text();
  document.getElementById("responseMessage").innerText = result;
  document.getElementById("responseMessage").style.display = "block";

  e.target.reset();
});
</script>

</body>
</html>
